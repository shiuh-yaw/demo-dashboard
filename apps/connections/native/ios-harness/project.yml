name: WebViewHarness
options:
  bundleIdPrefix: com.fireblocks.poc
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  WebViewHarness:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fireblocks.poc.WebViewHarness
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        # Set your Apple Developer Team ID via the IOS_DEV_TEAM env var before
        # `xcodegen generate`, or just pick your team in Xcode → Signing.
        # e.g. IOS_DEV_TEAM=ABCDE12345 xcodegen generate
        DEVELOPMENT_TEAM: ${IOS_DEV_TEAM}
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Wallet Connect
        # Full-resolution launch (no storyboard needed for a SwiftUI app).
        UILaunchScreen: {}
        # Registers fbapp:// so the OS routes the return to this app (used by
        # SFSafariVC + any wallet returning to us).
        CFBundleURLTypes:
          - CFBundleURLName: com.fireblocks.poc.WebViewHarness.callback
            CFBundleURLSchemes:
              - fbapp
        # Lets UIApplication.canOpenURL see these wallet schemes (opening still
        # works without this, but logging/probing is cleaner with it).
        LSApplicationQueriesSchemes:
          - metamask
          - phantom
          - wc
          - trust
          - rainbow
          - okx
          - zerion
          - argent
          - ledgerlive
          - cbwallet
