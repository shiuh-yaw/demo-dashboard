# Dependency catalog — single source of truth for shared package versions.
# Apps reference via `"<pkg>": "catalog:"` instead of pinning. Future bumps
# = edit this file, then run `pnpm install --no-frozen-lockfile`.
#
# spark26 is intentionally NOT migrated to catalog references (D-006 zero-touch).
# Leave its package.json untouched even when versions match the catalog.
#
# Inclusion rule: only deps that are byte-identical across all non-spark26
# consumers belong in the catalog. Drift cases (caret-vs-exact, minor-version
# spread) are deliberately left explicit and tracked for follow-up PRs.
packages:
  - "apps/*"
  - "packages/*"

catalog:
  # Dynamic SDK (Phase 1D consolidated all 9 SDK-consuming apps to 0.25.0)
  "@dynamic-labs-sdk/client": "0.25.0"
  "@dynamic-labs-sdk/evm": "0.25.0"
  "@dynamic-labs-sdk/solana": "0.25.0"
  "@dynamic-labs-sdk/wallet-connect": "0.25.0"
  "@dynamic-labs-sdk/sui": "0.25.0"
  "@dynamic-labs-sdk/bitcoin": "0.25.0"
  "@dynamic-labs-sdk/aptos": "0.25.0"
  "@dynamic-labs-sdk/tron": "0.25.0"
  "@dynamic-labs-sdk/starknet": "0.25.0"
  "@dynamic-labs-sdk/ton": "0.25.0"
  "@dynamic-labs-sdk/zerodev": "0.25.0"
  "@dynamic-labs/iconic": "4.61.1"

  # Chain libraries (pinned to versions bundled by @dynamic-labs-sdk/* 0.25.0)
  "@mysten/sui": "1.45.1"
  "starknet": "6.23.1"

  # Framework
  # Versions downshifted from 15.5.18 / 19.1.7 to JFrog-compatible pins.
  # JFrog hosts next@15.5.18 itself, but is missing its companion `@next/*`
  # transitives at 15.5.16/.17/.18 (env, swc-*, etc.) — so 15.5.15 is the
  # highest 15.5.x where the whole bundle resolves. Likewise react/react-dom
  # 19.1.7 are not in JFrog (latest 19.1.x is 19.1.6).
  next: "15.5.15"
  react: "19.1.6"
  react-dom: "19.1.6"

  # Solana ecosystem (used by checkouts, wallet, etc.)
  "@solana/web3.js": "1.98.4"
  # Peer required by `@solana/codecs-strings` and ~50 other @solana/* 2.x/3.x
  # packages. Pure-JS TextEncoder/TextDecoder polyfill for legacy runtimes;
  # modern Node + browsers already have those natives, but pnpm flags the
  # missing peer ~50 times across the tree. Pinning here silences the noise
  # and stays compatible with the upstream `>=1.0.22 <2.0.0-0` range.
  fastestsmallesttextencoderdecoder: "1.0.22"
  # Peer required by `@solana/rpc-subscriptions-channel-websocket` (pulled in
  # via @coinbase/cdp-sdk → @solana/kit). Browser code uses native WebSocket,
  # but Node-side codepaths that touch Solana RPC subscriptions throw
  # `Cannot find module 'ws'` without this. Pinning at the floor of `^8.18.0`.
  ws: "8.18.0"

  # Cross-chain SDK
  "@lifi/sdk": "3.14.1"

  # Data fetching
  "@tanstack/react-query": "5.90.16"

  # Shared UI primitives
  clsx: "2.1.1"
  tw-animate-css: "1.4.0"

  # Tooling
  typescript: "5.9.3"
  vitest: "2.1.9"
  eslint: "9.39.1"
  # eslint-config-next downshifted 15.5.18 → 15.5.15: JFrog mirror is missing
  # 15.5.16/17/18 of eslint-config-next specifically (it has next@15.5.18 but
  # not the matching eslint config). 15.5.15 is the latest 15.5.x JFrog has.
  "eslint-config-next": "15.5.15"
  "@eslint/eslintrc": "3.3.1"

# Note on spark26: spark26 hardcodes react@19.1.7 / react-dom@19.1.7 /
# eslint-config-next@15.5.18 in its package.json — versions JFrog's mirror
# does not have. D-006 forbids touching apps/spark26/. The redirect to
# JFrog-available versions lives in the root `package.json` under
# `pnpm.overrides` (alongside the existing ufo/axios overrides), since
# workspace-yaml-level overrides don't rescue direct-dep registry misses.
# Retire the spark26-specific entries once JFrog catches up.
