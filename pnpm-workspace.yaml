# Dependency catalog — single source of truth for shared package versions.
# Apps reference via `"<pkg>": "catalog:"` instead of pinning. Future bumps
# = edit this file, then run `pnpm install --no-frozen-lockfile`.
#
# spark26 is intentionally NOT migrated to catalog references (D-006 zero-touch).
# Leave its package.json untouched even when versions match the catalog. Its
# Dynamic SDK pins are kept at the catalog version by hand, not by reference.
#
# Inclusion rule: only deps that are byte-identical across all non-spark26
# consumers belong in the catalog. Drift cases (caret-vs-exact, minor-version
# spread) are deliberately left explicit and tracked for follow-up PRs.
packages:
  - "apps/*"
  - "packages/*"

catalog:
  # Dynamic SDK — every consumer, spark26 included, sits on this version.
  "@dynamic-labs-sdk/client": "1.30.2"
  "@dynamic-labs-sdk/evm": "1.30.2"
  "@dynamic-labs-sdk/solana": "1.30.2"
  "@dynamic-labs-sdk/wallet-connect": "1.30.2"
  "@dynamic-labs-sdk/sui": "1.30.2"
  "@dynamic-labs-sdk/bitcoin": "1.30.2"
  "@dynamic-labs-sdk/aptos": "1.30.2"
  "@dynamic-labs-sdk/tron": "1.30.2"
  "@dynamic-labs-sdk/starknet": "1.30.2"
  "@dynamic-labs-sdk/ton": "1.30.2"
  "@dynamic-labs-sdk/zerodev": "1.30.2"
  "@dynamic-labs-sdk/react-hooks": "1.30.2"
  "@dynamic-labs-sdk/metamask": "1.30.2"
  "@dynamic-labs-sdk/droplet": "1.30.2"
  "@dynamic-labs/iconic": "5.4.0"

  # Dynamic Node SDK (server-custodied wallets) — own 1.0.x version line.
  "@dynamic-labs-wallet/node": "1.0.116"
  "@dynamic-labs-wallet/node-evm": "1.0.116"
  "@dynamic-labs-wallet/node-svm": "1.0.116"
  # Peer of @dynamic-labs-wallet/core; carries the MPC ceremony client.
  "@dynamic-labs-wallet/forward-mpc-client": "1.0.2"

  # Chain libraries (pinned to versions bundled by @dynamic-labs-sdk/* 1.30.2)
  # viem floor is set by @dynamic-labs-wallet/node-evm's `^2.45.3` peer;
  # every other consumer (SDK, zerodev, lifi) wants only `^2.28.x`.
  viem: "2.55.11"
  "@mysten/sui": "1.45.1"
  "starknet": "6.23.1"

  # Framework
  # Pinned to 15.5.22, the latest 15.5.x patch available in the JFrog mirror
  # and the release that addresses the July 2026 Next.js security advisories.
  next: "15.5.22"
  react: "19.1.6"
  react-dom: "19.1.6"

  # Solana ecosystem (used by checkouts, wallet, etc.)
  # Must match the copy @dynamic-labs-sdk/solana depends on, or Transaction /
  # VersionedTransaction resolve to two type identities and stop being assignable.
  "@solana/web3.js": "1.98.1"
  # Peer required by `@solana/codecs-strings` and ~50 other @solana/* 2.x/3.x
  # packages. Pure-JS TextEncoder/TextDecoder polyfill for legacy runtimes;
  # modern Node + browsers already have those natives, but pnpm flags the
  # missing peer ~50 times across the tree. Pinning here silences the noise
  # and stays compatible with the upstream `>=1.0.22 <2.0.0-0` range.
  fastestsmallesttextencoderdecoder: "1.0.22"
  # Peer required by `@solana/rpc-subscriptions-channel-websocket` (pulled in
  # via @coinbase/cdp-sdk → @solana/kit). Browser code uses native WebSocket,
  # but Node-side codepaths that touch Solana RPC subscriptions throw
  # `Cannot find module 'ws'` without this. Pinning to the latest compatible 8.x release.
  ws: "8.21.0"

  # Cross-chain SDK
  "@lifi/sdk": "3.14.1"

  # Validation - one zod 3.x across the workspace; mixing majors breaks
  # instanceof checks on schemas passed between packages.
  zod: "3.25.76"

  # Upstash / Redis. ioredis floor is set by unstorage's `^5.4.2` peer.
  ioredis: "5.6.1"
  "@upstash/qstash": "2.8.4"
  "@upstash/redis": "1.34.8"

  # Data fetching
  "@tanstack/react-query": "5.90.16"

  # Build + UI toolchain (tailwindcss and @tailwindcss/postcss move as a pair)
  lucide-react: "0.542.0"
  tailwindcss: "4.1.18"
  "@tailwindcss/postcss": "4.1.18"
  "@t3-oss/env-nextjs": "0.13.8"
  tailwind-merge: "3.4.0"
  "@types/node": "20.19.27"
  jsdom: "26.0.0"

  # Shared UI primitives
  clsx: "2.1.1"
  tw-animate-css: "1.4.0"

  # Tooling
  typescript: "5.9.3"
  vitest: "3.2.6"
  eslint: "9.39.1"
  # eslint-config-next pinned to match the Next.js patch release.
  "eslint-config-next": "15.5.22"
  "@eslint/eslintrc": "3.3.1"

# Note on spark26: spark26 hardcodes react@19.1.7 / react-dom@19.1.7 /
# eslint-config-next@15.5.18 in its package.json. D-006 forbids touching
# apps/spark26/. The root `package.json` `pnpm.overrides` keep the rest of
# the workspace on the same Next.js/react/eslint-config-next patch levels.
