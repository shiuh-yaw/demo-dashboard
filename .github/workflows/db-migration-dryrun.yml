name: DB migration dry-run

# Phase 2 (D-013) — apply pending Prisma migrations against a fresh Postgres
# container to prove they're valid before merge. Triggers only when the
# Prisma schema or any migration file changes.
#
# `prisma migrate deploy` is the canonical "apply migrations to a real DB"
# command (D-013 forbids `prisma db push` in production). Running it against
# an ephemeral Postgres container exercises the same code path.
#
# This workflow is a no-op until PR 2-brands generates the first migration.
# It still runs on schema-only changes so schema-validation regressions are
# caught at the same gate.

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/db/prisma/schema.prisma"
      - "packages/db/prisma/migrations/**"
      - ".github/workflows/db-migration-dryrun.yml"
  push:
    branches: [main]
    paths:
      - "packages/db/prisma/schema.prisma"
      - "packages/db/prisma/migrations/**"
      - ".github/workflows/db-migration-dryrun.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: db-migration-dryrun-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dryrun:
    name: prisma migrate deploy (ephemeral Postgres)
    # CodeBuild runner with Docker — the fargate pool doesn't expose
    # /var/run/docker.sock and GitHub's service-container feature (used
    # below for the ephemeral Postgres) needs the Docker daemon. Per the
    # org runner guide, `codebuild + docker` is the right label set for
    # any job that uses `services:` or runs `docker` commands directly.
    runs-on:
      - self-hosted
      - codebuild
      - default
      - docker

    services:
      # Ephemeral Postgres for the migration dry-run only. The container is
      # local to one runner job, never reachable from outside the runner
      # network, and torn down on job exit. We configure it with
      # `POSTGRES_HOST_AUTH_METHOD: trust` so connections require no
      # password — that eliminates the credential pattern that secret
      # scanners (FireHog / Semgrep) would otherwise flag on the connection
      # URLs below. There is no real secret being protected here; the
      # scanners can't distinguish CI-local dummies from production keys,
      # so removing the embedded credential is the cleanest mitigation.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma_ci
          POSTGRES_DB: prisma_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma_ci -d prisma_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Both URLs point at the in-runner Postgres. There is no pooler in CI;
      # using the direct port for both is fine because we're not exercising
      # connection-pool semantics here, only migration correctness.
      #
      # Host is `localhost` because the job's shell runs DIRECTLY on the
      # self-hosted CodeBuild runner (not inside a container) — GitHub
      # publishes the service container's port 5432 to the runner host
      # via the `ports:` mapping. Service-name DNS (`postgres`) only works
      # when the job ITSELF runs in a container on the same Docker network,
      # which is not the case here.
      #
      # No `:password@` segment — the container uses `trust` auth (see
      # `services.postgres.env` above). This keeps secret scanners quiet
      # without sacrificing security: the Postgres container only accepts
      # traffic from inside the runner's Docker network, which is torn
      # down with the job.
      DATABASE_URL: postgresql://prisma_ci@localhost:5432/prisma_ci
      DIRECT_URL: postgresql://prisma_ci@localhost:5432/prisma_ci
      # JFrog Artifactory mirror auth — interpolated into `.npmrc` for the
      # `pnpm install --frozen-lockfile` step below.
      JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        # Cheap sanity check — fails fast on schema syntax errors before
        # we spin up Postgres-backed migration validation below.
        run: pnpm --filter @dynamic-demos/db prisma:validate

      - name: Wait for Postgres
        # Uses bash's built-in /dev/tcp so we don't depend on `pg_isready`
        # or `nc` being present on the runner image — the CodeBuild image
        # ships neither out of the box. GitHub Actions already gates step
        # execution on the service container's health check; this is a
        # belt-and-suspenders TCP probe that also prints diagnostics on
        # failure (hostname resolution, network state) for future debugging.
        run: |
          set -uo pipefail
          for i in $(seq 1 30); do
            if (timeout 1 bash -c '</dev/tcp/localhost/5432') 2>/dev/null; then
              echo "postgres reachable after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not become reachable in time"
          echo "--- diagnostics ---"
          echo "getent hosts postgres:"
          getent hosts postgres || echo "  (cannot resolve)"
          echo "ip a (truncated):"
          ip a 2>&1 | head -30 || true
          echo "docker network inspect (best-effort):"
          docker network ls 2>&1 | head -10 || true
          exit 1

      - name: Detect migrations
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -d packages/db/prisma/migrations ] && \
             find packages/db/prisma/migrations -mindepth 1 -maxdepth 1 -type d \
                  -not -name 'migration_lock.toml*' | grep -q .; then
            echo "have_migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_migrations=false" >> "$GITHUB_OUTPUT"
            echo "No migrations present yet — phase 2 scaffold ships before any model."
          fi

      - name: Apply migrations to fresh Postgres (dry-run gate)
        if: steps.detect.outputs.have_migrations == 'true'
        run: pnpm --filter @dynamic-demos/db prisma:migrate:deploy

      - name: No migrations to apply (scaffold-only)
        if: steps.detect.outputs.have_migrations != 'true'
        run: |
          echo "Schema validates and Postgres is reachable, but no migrations"
          echo "exist yet (phase 2 scaffold). Gate is a no-op until PR 2-brands."
