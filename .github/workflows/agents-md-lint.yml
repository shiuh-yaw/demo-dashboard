name: agents-md-lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint AGENTS.md frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint every packages/*/AGENTS.md and apps/*/AGENTS.md
        run: node scripts/lint-agents-md.mjs

      - name: Verify .claude/demo-registry.{md,json} are up to date
        run: node scripts/generate-demo-registry.mjs --check
